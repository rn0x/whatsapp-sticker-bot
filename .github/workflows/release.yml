name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  linux-core:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build deb/rpm/AppImage/tar.gz
        run: npx electron-builder --linux deb rpm AppImage tar.gz --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-sandboxed:
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: npm ci
      - run: npm run build
      - name: Build flatpak + snap (best-effort)
        run: npx electron-builder --linux flatpak snap --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build Windows NSIS
        run: npx electron-builder --windows nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
